name: CI

# Mirrors the local scripts in package.json. Database tests (npm run db:test) are added in TASK-04.
# Deploy workflows are added in TASK-21. No secrets are needed or used by this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint, architecture rule checks, Prettier)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Dependency audit
        run: npm audit --audit-level=high
