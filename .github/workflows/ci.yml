name: CI

# Mirrors the local scripts in package.json. `db:verify` (TASK-03) applies the migrations to a throwaway PostgreSQL.
# `db:test` (TASK-04) runs the SQL security tests on the same throwaway PostgreSQL. Neither replaces a run on a real Supabase stack.
# Deploy workflows are added in TASK-21. No secrets are needed or used by this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint, architecture rule checks, Prettier)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Database migrations and constraints (temporary PostgreSQL 17)
        run: npm run db:verify

      - name: Database security tests (RLS, roles, bootstrap, invitations; temporary PostgreSQL 17)
        run: npm run db:test

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Dependency audit
        run: npm audit --audit-level=high
