name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces & e2e)
        run: npm run typecheck

      - name: Lint & architecture boundary checks
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Build web & worker dry-run
        run: npm run build

      - name: Database schema & constraints (PostgreSQL 17)
        run: npm run db:verify

      - name: SQL security & RLS tests (PostgreSQL 17)
        run: npm run db:test

      - name: Secrets scan
        run: npm run secrets:scan

  deploy-staging:
    name: Deploy to Staging
    needs: test
    # Disabled until the PostgreSQL-backed Worker adapters and hosted environment setup are verified.
    # The repository variable must be explicitly enabled by an owner after the readiness audit.
    if: ${{ vars.AUTOPW3_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application (staging)
        run: npm run build -w @autopw3/web
        env:
          VITE_DEMO_MODE: 'false'
          VITE_AUTH_MODE: 'supabase'
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Deploy Cloudflare Worker (staging)
        run: npx wrangler deploy --env staging
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: ${{ vars.AUTOPW3_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://autopw3.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application (production)
        run: npm run build -w @autopw3/web
        env:
          VITE_DEMO_MODE: 'false'
          VITE_AUTH_MODE: 'supabase'
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

      - name: Deploy Cloudflare Worker (production)
        run: npx wrangler deploy --env production
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
