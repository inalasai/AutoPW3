name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces & e2e)
        run: npm run typecheck

      - name: Lint & architecture boundary checks
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Build web & worker dry-run
        run: npm run build

      - name: Database schema & constraints (PostgreSQL 17)
        run: npm run db:verify

      - name: SQL security & RLS tests (PostgreSQL 17)
        run: npm run db:test

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E smoke tests
        run: npm run test:e2e

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Supabase database migrations (staging)
        if: env.STAGING_DB_URL != ''
        run: npx --yes supabase@2.122.0 db push --db-url "${{ secrets.STAGING_SUPABASE_DB_URL }}"
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

      - name: Build web application (staging)
        run: npm run build -w @autopw3/web
        env:
          VITE_DEMO_MODE: 'false'
          VITE_AUTH_MODE: 'supabase'
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Deploy Cloudflare Worker (staging)
        run: npx wrangler deploy --env staging
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deployment health check (staging)
        run: |
          curl -f -s -S --max-time 15 "https://staging.autopw3.example.com/api/v1/health" | grep -q '"status":"ok"'

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://autopw3.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Supabase database migrations (production)
        if: env.PROD_DB_URL != ''
        run: npx --yes supabase@2.122.0 db push --db-url "${{ secrets.PROD_SUPABASE_DB_URL }}"
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}

      - name: Build web application (production)
        run: npm run build -w @autopw3/web
        env:
          VITE_DEMO_MODE: 'false'
          VITE_AUTH_MODE: 'supabase'
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

      - name: Deploy Cloudflare Worker (production)
        run: npx wrangler deploy --env production
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deployment health check (production)
        run: |
          curl -f -s -S --max-time 15 "https://autopw3.example.com/api/v1/health" | grep -q '"status":"ok"'
