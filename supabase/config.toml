# Supabase CLI configuration for LOCAL development only (TASK-03).
# Parsed by Supabase CLI 2.122.0; full Docker startup/reset remains NOT_EXECUTED on this machine.
# See docs/DEVELOPER_SETUP.md. No secrets belong here: local keys are generated by `supabase start`.

project_id = "autopw3"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# PostgreSQL major version of the local database. The verification script (npm run db:verify) uses PostgreSQL 17.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/callback", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
minimum_password_length = 12
# Sign-up policy is an open owner decision (Q-12). Local default: sign-up allowed; new users get no household and no role.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
