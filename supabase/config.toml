# Supabase CLI configuration for LOCAL development only (TASK-03).
# NOT_EXECUTED: this file was written by hand and has not been loaded by the Supabase CLI (Docker and the CLI were not
# available when it was written). Run `npm run db:reset` on a machine with Docker to confirm it; correct any key the
# CLI rejects. No secrets belong here: local keys are generated by `supabase start`.

project_id = "autopw3"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# PostgreSQL major version of the local database. The verification script (npm run db:verify) uses PostgreSQL 17.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Sign-up policy is an open owner decision (Q-12). Local default: sign-up allowed; new users get no household and no role.
enable_signup = true
